{% extends "_layout.html.j2" %}
{% block body %}
<div class="ww-landing-container">
    <div class="ww-landing-card">
        <div class="ww-landing-logo">WESTWORDS</div>
        <div class="ww-landing-tagline">Words &amp; Wolves</div>
        
        <form action="/username" method="POST" class="mt-4">
            <div class="form-group mb-4 text-start">
                <label for="username" class="form-label text-gold font-weight-bold" style="font-family: var(--ww-font-heading); letter-spacing: 0.05em;">Enter Thy Username</label>
                <input id="username" class="form-control form-control-lg text-center" name="username" 
                       value="{{ session.username }}" required autocomplete="off" placeholder="e.g. Hunter"
                       style="letter-spacing: 0.05em; font-size: 1.25rem;">
            </div>
            
            <button class="btn btn-primary btn-lg w-100 py-3" type="submit" id="." style="font-size: 1.1rem; letter-spacing: 0.1em; text-transform: uppercase;">
                Claim Identity
            </button>
        </form>
    </div>
</div>
{% endblock %}
